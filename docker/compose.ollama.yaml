name: recipeat-ai

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama:/root/.ollama
    cpus: 4.0
    mem_limit: 8g
    memswap_limit: 8g
    init: true
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: "16384"
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_KEEP_ALIVE: "5m"
      RECIPEAT_MODEL: "qwen3.5:2b"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        (
          until /bin/ollama list >/dev/null 2>&1; do sleep 1; done
          /bin/ollama pull "$$RECIPEAT_MODEL"
        ) &
        exec /bin/ollama serve
    # Healthy means the model is installed, not just that the server answers,
    # so start_period has to cover the first pull.
    healthcheck:
      test: ["CMD-SHELL", "/bin/ollama list | grep -q \"$$RECIPEAT_MODEL\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 600s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ollama:
    external: true
    name: ollama
