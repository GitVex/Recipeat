# The app faces the user and reaches one service of its own: the fetcher, which
# publishes on loopback, which a container cannot reach. So they share a network
# and it is addressed by the alias the fetcher declares.
#
# That network is the fetcher's alone rather than Coolify's shared one, because
# the fetcher opens connections to URLs a user supplies and has no SSRF guard.
#
# The remaining cost is stated rather than hidden: on recipeat-fetch-net the
# fetcher can open connections to this app. Docker does not route between
# networks, so that is as far as it gets — an SSRF through the fetcher reaches
# this app's API and nothing else on the host.
#
# Extraction itself no longer runs here. The model is Gemini, reached over the
# internet with NUXT_GEMINI_API_KEY, which is why this is the first of these
# files to carry a secret.
name: recipeat-app

services:
  recipeat-app:
    # Relative to the Compose file's directory. Coolify passes
    # --project-directory, so a resource deploying this file needs Base
    # Directory /docker and Docker Compose Location /compose.app.yaml, the same
    # as the fetcher resource.
    build:
      context: ..
      dockerfile: Dockerfile
    image: recipeat-app:latest
    container_name: recipeat-app
    restart: unless-stopped
    # Loopback, like the services: a reverse proxy on the host terminates TLS
    # and forwards here. Coolify's proxy reaches the container over its own
    # network and does not need this published at all.
    ports:
      - "127.0.0.1:8100:8100"
    environment:
      # The container port, not the host one, and the alias the fetcher file
      # declares on recipeat-fetch-net — so Coolify renaming containers does
      # not break it.
      NUXT_FETCHER_BASE_URL: "http://recipeat-fetcher:8103"
      # Extraction for both the text and photo routes. Billing must be enabled
      # on the Google project: the free tier is not licensed for an API client
      # serving users in the EEA, and its quota would not carry this anyway.
      NUXT_GEMINI_API_KEY: ${NUXT_GEMINI_API_KEY:?required}
      # Zitadel. The redirect URIs must be this deployment's public URL, not the
      # localhost:8100 a checkout defaults to, and must match the application
      # registered in Zitadel character for character.
      NUXT_OIDC_PROVIDERS_ZITADEL_BASE_URL: ${NUXT_OIDC_PROVIDERS_ZITADEL_BASE_URL:?required}
      NUXT_OIDC_PROVIDERS_ZITADEL_CLIENT_ID: ${NUXT_OIDC_PROVIDERS_ZITADEL_CLIENT_ID:?required}
      NUXT_OIDC_PROVIDERS_ZITADEL_REDIRECT_URI: ${NUXT_OIDC_PROVIDERS_ZITADEL_REDIRECT_URI:?required}
      NUXT_OIDC_PROVIDERS_ZITADEL_LOGOUT_REDIRECT_URI: ${NUXT_OIDC_PROVIDERS_ZITADEL_LOGOUT_REDIRECT_URI:?required}
      # Generated separately; see docs/authentication.md.
      NUXT_OIDC_SESSION_SECRET: ${NUXT_OIDC_SESSION_SECRET:?required}
      NUXT_OIDC_AUTH_SESSION_SECRET: ${NUXT_OIDC_AUTH_SESSION_SECRET:?required}
      NUXT_OIDC_TOKEN_KEY: ${NUXT_OIDC_TOKEN_KEY:?required}
    volumes:
      # The OIDC session store. Without it every restart signs everyone out.
      - app-data:/app/.data
    cpus: 1.0
    # SSR and the extraction handlers, which stream rather than buffer. The
    # photo route holds one upload in memory at MAX_PHOTO_BYTES, plus its base64
    # copy on the way out to the model.
    mem_limit: 512m
    memswap_limit: 512m
    networks:
      - default
      - fetch
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # The only network these files ask you to create:
  #
  #   docker network create recipeat-fetch-net
  #
  # Not <project>_default: Coolify runs Compose with --project-name
  # <resource-uuid>, which overrides every `name:` in these files, so the
  # generated network names are neither stable nor knowable from here.
  fetch:
    external: true
    name: recipeat-fetch-net

volumes:
  app-data:
