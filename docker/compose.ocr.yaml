# A separate Compose project again, for the opposite reason to the fetcher's.
# The fetcher must reach the internet and so is kept away from anything private;
# this service reaches nothing at all. Its models come with the wheel, so it
# never has a reason to open an outbound connection.
#
# That is a property of the image, not of this file. `internal: true` looks like
# the way to enforce it and is not: Docker drops every published port for a
# container on an internal network, so the app could no longer reach the
# service. Compose cannot express "ingress but no egress". Enforcing it needs a
# host rule, and the service README carries the one to use.
name: recipeat-ocr

services:
  recipeat-ocr:
    build: ../services/recipeat-ocr
    image: recipeat-ocr:latest
    container_name: recipeat-ocr
    restart: unless-stopped
    # Loopback only, like Ollama and the fetcher. Nothing off the host reaches it.
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      OCR_MAX_BYTES: "10000000"
      OCR_MAX_SIDE_LEN: "2000"
      OCR_TEXT_SCORE: "0.5"
      # Match this to `cpus` below: ONNX Runtime otherwise takes every core on
      # the host, and Ollama is already capped at four of six.
      OCR_INTRA_OP_THREADS: "2"
    cpus: 2.0
    # Three ONNX models and one decoded image at a time. Measured peak is 649 MiB
    # for a 3024x4032 photo; the rest is headroom for a larger one.
    mem_limit: 2g
    memswap_limit: 2g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
