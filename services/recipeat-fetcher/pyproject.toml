[project]
name = "recipeat-fetcher"
version = "0.1.0"
description = "Fetches recipes from the web and parses their ingredients."
readme = "README.md"
authors = [
    { name = "Paul", email = "Paul.krahn1903@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "ingredient-parser-nlp>=2.3.0",
    "pydantic-settings>=2.15.0",
    "recipe-scrapers>=15.12.0",
]

[project.scripts]
recipeat-fetcher = "recipeat_fetcher:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
