rement\":\"ml\",\"displayTextSuffix\":null,\"image\":\"08e25ee915a301b267955761e67d408b78c8716b9449959bd7ff18306d5af8b1\",\"color\":{\"primary\":\"#9F7234\",\"secondary\":\"#F0E8DD\"},\"type\":\"CORE_STOCKABLE\"},{\"id\":\"61076531-5111-4746-bafa-db1307914f9a\",\"name\":\"Reis\",\"displayIngredientQuantity\":300,\"displayUnitOfMeasurement\":\"g\",\"displayTextSuffix\":null,\"image\":\"ea6ac92a34a8164f6b976023ede4c5631a6d068586bcf680a5c603e34b780721\",\"color\":{\"primary\":\"#9F7234\",\"secondary\":\"#F0E8DD\"},\"type\":\"CORE\"},{\"id\":\"fa9c5c7a-4b5f-4714-bd87-728e3e335da7\",\"name\":\"Schaschlikspieße\",\"displayIngredientQuantity\":8,\"displayUnitOfMeasurement\":\"Stk.\",\"displayTextSuffix\":null,\"image\":\"1f7f12ed82afda77364d054d9af76ea19cace26d27f115c9e1bf9234ee4c4134\",\"color\":{\"primary\":\"#897D67\",\"secondary\":\"#EBE9E5\"},\"type\":\"CUPBOARD\"},{\"id\":\"71007fee-dcd8-42e7-9469-edf0655035da\",\"name\":\"Gurke\",\"displayIngredientQuantity\":1,\"displayUnitOfMeasurement\":\"Stk.\",\"displayTextSuffix\":null,\"image\":\"5d825704e96c9e359a9428da40b062c88f67d1a32012f2038a5df2bd4d6fd786\",\"color\":{\"primary\":\"#7C9326\",\"secondary\":\"#E7ECD7\"},\"type\":\"CORE\"},{\"id\":\"6bbeced0-f846-4815-b7de-dca50e160d70\",\"name\":\"Dill\",\"displayIngredientQuantity\":1,\"displayUnitOfMeasurement\":\"Bund\",\"displayTextSuffix\":null,\"image\":\"de2693d266902f57f8c5fc630327fde99b4dffe50e86c92bbbfe42468d82bb12\",\"color\":{\"primary\":\"#7C9326\",\"secondary\":\"#E7ECD7\"},\"type\":\"CORE\"},{\"id\":\"7febec57-0b24-4068-9446-c8510bec77db\",\"name\":\"Griechischer Joghurt\",\"displayIngredientQuantity\":250,\"displayUnitOfMeasurement\":\"g\",\"displayTextSuffix\":null,\"image\":\"de94abd8e8d4f89ac24a5498aad5527407e90d06ab01b4cf155eb154b5464471\",\"color\":{\"primary\":\"#268484\",\"secondary\":\"#E3EEEE\"},\"type\":\"CORE\"},{\"id\":\"4050a1e7-906b-4828-a4ad-42ec18e1f1bb\",\"name\":\"Fladenbrot\",\"displayIngredientQuantity\":null,\"displayUnitOfMeasurement\":\"Stk.\",\"displayTextSuffix\":null,\"image\":\"af21f6a703fb663da133372afaa9b6be100c3fd4f6d8538bf1a8d93ca0bc025e\",\"color\":{\"primary\":\"#9F7234\",\"secondary\":\"#F0E8DD\"},\"type\":\"VARIATION\"},{\"id\":\"9ae133a6-0aa9-4afe-8d13-7dc27107f26b\",\"name\":\"Pommes\",\"displayIngredientQuantity\":null,\"displayUnitOfMeasurement\":null,\"displayTextSuffix\":null,\"image\":\"50f374ac8198e76a1a2c293caa26d2bbbfc6b46c7e8f2a8a899437120b91b12f\",\"color\":{\"primary\":\"#268484\",\"secondary\":\"#E3EEEE\"},\"type\":\"VARIATION\"}],\"preparationInstructions\":[{\"type\":\"STEP\",\"body\":\"Mit dem Marinieren des Hähnchens beginnen. Hierfür **1 Zitrone** pressen und **4 Knoblauchzehen** zerdrücken und klein hacken. In einer Schüssel 1/4 des gehackten Knoblauchs mit **2 EL Zitronensaft**, **1 EL getrockneten Oregano**, **2 EL Olivenöl**, **Salz** und **Pfeffer** vermischen. **500 g Hähnchen-Geschnetzeltes** mit der Marinade vermengen und mind. **15 Min.** marinieren lassen.\",\"header\":\"Schritt 1\"},{\"type\":\"STEP\",\"body\":\"**1 Zwiebel** schälen und klein hacken. **1 EL Öl** in einer Bratpfanne erhitzen und die Zwiebel **5 Min.** anbraten, die Hälfte des Knoblauchs dazugeben und noch **1 Min.** anbraten. **2 EL Tomatenmark** hinzufügen und **2 Min.** braten.\",\"header\":\"Schritt 2\"},{\"type\":\"STEP\",\"body\":\"In der Zwischenzeit **500 g Tomaten** waschen und in kleine Stücke schneiden. **450 ml Hühnerbrühe** nach Packungsanweisungen zubereiten. **300 g Reis** und die Tomatenscheiben mit der Zwiebel in die Pfanne geben und gut verrühren. Die Brühe in die Pfanne geben, zum Kochen bringen und den Reis zugedeckt ca. **10-13 Min.** garen.\",\"header\":\"Schritt 3\"},{\"type\":\"STEP\",\"body\":\"Hähnchen-Geschnetzeltes auf **8 Spieße** stecken. Eine Grillpfanne oder Bratpfanne bei starker Hitze erhitzen und die Spieße auf jeder Seite **2 Min.** braten. Die Hitze reduzieren und die Spieße weitere **4 Min.** bei schwacher Hitze garen lassen.\",\"header\":\"Schritt 4\"},{\"type\":\"STEP\",\"body\":\"In der Zwischenzeit das Tzatziki zubereiten. Dazu **1 Gurke** waschen und der Länge nach halbieren. Die Kerne mit einem Löffel herausholen. Die Gurke mit einer groben Reibe reiben. Die Blätter von **1 Bund Dill** fein hacken.\",\"header\":\"Schritt 5\"},{\"type\":\"STEP\",\"body\":\"**250 ml griechischen Joghurt** mit der geriebenen Gurke, dem Dill und dem restlichen Knoblauch vermischen. Mit **1 Prise Salz** und **Pfeffer** abschmecken und würzen.\",\"header\":\"Schritt 6\"},{\"type\":\"STEP\",\"body\":\"Das Hähnchen-Souvlaki mit Tomatenreis und Zaziki servieren.\",\"header\":\"Schritt 7\"},{\"type\":\"TIP\",\"body\":\"Extra schnell mit fertigem Tzatziki. Das Souvlaki kann auch mit Fladenbrot oder (Ofen-)Pommes serviert werden.\",\"header\":\"Tipp\"}]},\"mobileView\":false,\"locale\":\"de\"}],\"$L23\"]}]\n"])</script>
